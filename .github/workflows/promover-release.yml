name: Promover release

on:
  workflow_dispatch:
    inputs:
      versao:
        description: Versão SemVer do rascunho a publicar
        required: true
        type: string
      modo:
        description: Promover, reprocessar o feed ou suspender uma release publicada
        required: true
        default: promover
        type: choice
        options:
          - promover
          - reprocessar-feed
          - suspender
      motivo_suspensao:
        description: Motivo público e sucinto da suspensão (obrigatório no modo suspender)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-producao
  cancel-in-progress: false

jobs:
  validar-publicar-gerar-feed:
    name: Validar, publicar e assinar feed
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar identidade e rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ inputs.versao }}
          MODO: ${{ inputs.modo }}
          MOTIVO_SUSPENSAO: ${{ inputs.motivo_suspensao }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          VERSAO_ESPERADA="$VERSAO" node --input-type=module -e "import { lerVersaoProjeto } from './scripts/release/versao-projeto.mjs'; const atual = await lerVersaoProjeto(); if (atual !== process.env.VERSAO_ESPERADA) throw new Error(\`Versão do projeto (\${atual}) difere do rascunho (\${process.env.VERSAO_ESPERADA}).\`);"
          gh release view "v$VERSAO" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,assets,body > release.json
          test "$(jq -r .tagName release.json)" = "v$VERSAO"
          test "$(jq -r .isPrerelease release.json)" = false
          git fetch --tags --force origin "refs/tags/v$VERSAO:refs/tags/v$VERSAO"
          commit_tag="$(git rev-list -n 1 "v$VERSAO")"
          commit_alvo="$(jq -r .targetCommitish release.json)"
          if [[ "$commit_alvo" =~ ^[0-9a-f]{40}$ ]]; then
            test "$commit_tag" = "$commit_alvo"
          fi
          if [ "$MODO" = promover ]; then test "$(jq -r .isDraft release.json)" = true; fi
          if [ "$MODO" = reprocessar-feed ]; then test "$(jq -r .isDraft release.json)" = false; fi
          if [ "$MODO" = suspender ]; then
            test "$(jq -r .isDraft release.json)" = false
            test -n "$MOTIVO_SUSPENSAO"
          fi
          jq .assets release.json > assets.json
          jq -r .body release.json > notas-release.md
          mkdir rascunho
          if [ "$MODO" = promover ]; then
            artefato_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=manifesto-assinado-$VERSAO" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last.id')"
            test -n "$artefato_id"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artefato_id/zip" > manifesto-assinado.zip
            unzip -q manifesto-assinado.zip -d rascunho
          elif ! curl --fail --location --retry 4 "https://issjunior.github.io/laWdo/historico/v$VERSAO/manifesto.json" --output rascunho/manifesto.json \
            || ! curl --fail --location --retry 4 "https://issjunior.github.io/laWdo/historico/v$VERSAO/manifesto.json.sig" --output rascunho/manifesto.json.sig; then
            rm -f rascunho/manifesto.json rascunho/manifesto.json.sig
            artefato_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=manifesto-assinado-$VERSAO" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last.id')"
            if [ -n "$artefato_id" ]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artefato_id/zip" > manifesto-assinado.zip
              unzip -q manifesto-assinado.zip -d rascunho
            else
              gh release download "v$VERSAO" --repo "$GITHUB_REPOSITORY" --dir rascunho --pattern 'manifesto.json' --pattern 'manifesto.json.sig'
            fi
          fi
          node scripts/release/validar-promocao.mjs \
            --versao "$VERSAO" \
            --manifesto rascunho/manifesto.json \
            --assinatura rascunho/manifesto.json.sig \
            --notas notas-release.md \
            --assets assets.json

      - name: Publicar release validada
        if: ${{ inputs.modo == 'promover' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ inputs.versao }}
        run: gh release edit "v$VERSAO" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Registrar suspensão no histórico da release
        if: ${{ inputs.modo == 'suspender' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ inputs.versao }}
          MOTIVO_SUSPENSAO: ${{ inputs.motivo_suspensao }}
        run: |
          if grep --fixed-strings --quiet '<!-- lawdo:suspensa-do-feed -->' notas-release.md; then
            echo "A release v$VERSAO já está suspensa do feed."
            exit 0
          fi
          printf '\n<!-- lawdo:suspensa-do-feed: %s -->\n' "$MOTIVO_SUSPENSAO" >> notas-release.md
          gh release edit "v$VERSAO" --repo "$GITHUB_REPOSITORY" --notes-file notas-release.md

      - name: Baixar manifestos das releases publicadas
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ inputs.versao }}
        run: |
          mkdir releases-publicadas
          while IFS= read -r tag; do
            mkdir "releases-publicadas/$tag"
            if [ "$tag" = "v$VERSAO" ]; then
              cp rascunho/manifesto.json rascunho/manifesto.json.sig "releases-publicadas/$tag/"
            elif ! curl --fail --location --retry 4 "https://issjunior.github.io/laWdo/historico/$tag/manifesto.json" --output "releases-publicadas/$tag/manifesto.json" \
              || ! curl --fail --location --retry 4 "https://issjunior.github.io/laWdo/historico/$tag/manifesto.json.sig" --output "releases-publicadas/$tag/manifesto.json.sig"; then
              rm -f "releases-publicadas/$tag/manifesto.json" "releases-publicadas/$tag/manifesto.json.sig"
              versao_tag="${tag#v}"
              artefato_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=manifesto-assinado-$versao_tag" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last.id')"
              if [ -n "$artefato_id" ]; then
                arquivo_zip="manifesto-assinado-$versao_tag.zip"
                gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artefato_id/zip" > "$arquivo_zip"
                unzip -q "$arquivo_zip" -d "releases-publicadas/$tag"
              else
                gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "releases-publicadas/$tag" --pattern 'manifesto.json' --pattern 'manifesto.json.sig'
              fi
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body | grep --fixed-strings --quiet '<!-- lawdo:suspensa-do-feed -->'; then
              touch "releases-publicadas/$tag/.suspensa"
            fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName')

      - name: Gerar feed completo assinado
        env:
          CHAVE_PRIVADA_ASSINATURA: ${{ secrets.CHAVE_PRIVADA_ASSINATURA }}
        run: |
          node scripts/release/gerar-feed.mjs --diretorio releases-publicadas --saida feed
          while IFS= read -r manifesto; do
            diretorio_origem="$(dirname "$manifesto")"
            tag="$(basename "$diretorio_origem")"
            diretorio_destino="feed/historico/$tag"
            mkdir -p "$diretorio_destino"
            cp "$diretorio_origem/manifesto.json" "$diretorio_origem/manifesto.json.sig" "$diretorio_destino/"
          done < <(find releases-publicadas -type f -name manifesto.json | sort)

      - name: Enviar feed assinado para Pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feed-assinado
          path: feed
          if-no-files-found: error

  preparar-pages:
    name: Preparar artefato do Pages
    needs: validar-publicar-gerar-feed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Baixar feed assinado
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: feed-assinado
          path: feed

      - name: Enviar artefato estático
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: feed

  implantar-pages:
    name: Implantar e registrar feed
    needs: preparar-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.implantacao.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Implantar Pages
        id: implantacao
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Baixar feed assinado para verificação
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: feed-assinado
          path: feed

      - name: Verificar feed implantado por HTTPS
        env:
          URL_FEED: ${{ steps.implantacao.outputs.page_url }}
        run: |
          test -n "$URL_FEED"
          while IFS= read -r arquivo; do
            destino="remoto/${arquivo#feed/}"
            mkdir -p "$(dirname "$destino")"
            curl --fail --location --retry 6 --retry-all-errors "$URL_FEED/${arquivo#feed/}" --output "$destino"
            cmp --silent "$arquivo" "$destino"
          done < <(find feed -type f | sort)
          echo "Feed implantado e verificado em $URL_FEED"
