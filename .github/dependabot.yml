version: 2

multi-ecosystem-groups:
  atualizacoes-mensais:
    target-branch: "main"
    open-pull-requests-limit: 1
    schedule:
      interval: "monthly"
      day: "1"
      time: "09:00"
      timezone: "America/Sao_Paulo"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "atualizacoes-mensais"
    groups:
      npm-seguranca:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "atualizacoes-mensais"
    groups:
      github-actions-seguranca:
        applies-to: "security-updates"
        patterns:
          - "*"
