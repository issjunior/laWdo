name: Preparar release

on:
  workflow_dispatch:
    inputs:
      notas_atualizacao:
        description: Resumo final exibido no aplicativo e assinado no manifesto
        required: true
        type: string
      incluir_windows:
        description: Incluir instalador Windows x64
        required: true
        default: true
        type: boolean
      incluir_linux:
        description: Incluir AppImage e DEB Linux x64
        required: true
        default: true
        type: boolean
      incluir_macos:
        description: Incluir instaladores DMG macOS x64 e arm64 experimentais
        required: true
        default: true
        type: boolean
      confirmacao_plataformas_omitidas:
        description: Digite CONFIRMO se alguma plataforma for omitida
        required: false
        type: string
      modo:
        description: Criar nova release ou retomar um rascunho limpo da mesma versão
        required: true
        default: criar
        type: choice
        options:
          - criar
          - retomar

permissions:
  contents: read

concurrency:
  group: release-producao
  cancel-in-progress: false

jobs:
  validar:
    name: Validar solicitação
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
    outputs:
      versao: ${{ steps.planejamento.outputs.versao }}
      commit: ${{ steps.estado.outputs.commit }}
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Validar solicitação
        env:
          INCLUIR_WINDOWS: ${{ inputs.incluir_windows }}
          INCLUIR_LINUX: ${{ inputs.incluir_linux }}
          INCLUIR_MACOS: ${{ inputs.incluir_macos }}
          CONFIRMACAO_PLATAFORMAS_OMITIDAS: ${{ inputs.confirmacao_plataformas_omitidas }}
          MODO: ${{ inputs.modo }}
          NOTAS_ATUALIZACAO: ${{ inputs.notas_atualizacao }}
        run: node scripts/release/validar-solicitacao.mjs

      - name: Calcular próxima versão
        id: planejamento
        env:
          GH_TOKEN: ${{ github.token }}
          MODO: ${{ inputs.modo }}
        run: |
          ultima_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          ULTIMA_VERSAO_PUBLICADA="${ultima_tag#v}" node scripts/release/planejar-versao.mjs

      - name: Validar destino da preparação
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.planejamento.outputs.versao }}
          MODO: ${{ inputs.modo }}
        run: |
          if [ "$MODO" = criar ]; then
            ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSAO" --silent
            ! gh release view "v$VERSAO" --repo "$GITHUB_REPOSITORY" --json id --jq .id
          else
            git fetch --tags --force origin "refs/tags/v$VERSAO:refs/tags/v$VERSAO"
            test -n "$(git rev-list -n 1 "v$VERSAO")"
          fi

      - name: Atualizar metadados para o próximo patch
        if: ${{ steps.planejamento.outputs.incrementar == 'true' }}
        env:
          VERSAO: ${{ steps.planejamento.outputs.versao }}
        run: |
          npm version patch --no-git-tag-version
          node --input-type=module -e "import { lerVersaoProjeto } from './scripts/release/versao-projeto.mjs'; const atual = await lerVersaoProjeto(); if (atual !== process.env.VERSAO) throw new Error(\`Versão gerada (\${atual}) difere da planejada (\${process.env.VERSAO}).\`);"

      - name: Integrar atualização da versão na main
        id: integrar
        if: ${{ steps.planejamento.outputs.incrementar == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.planejamento.outputs.versao }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          ramo="codex/release-v$VERSAO-$GITHUB_RUN_ID"
          git switch -c "$ramo"
          git add package.json package-lock.json
          git commit -m "update_versao_para_${VERSAO//./_}"
          git push origin "$ramo"
          url_pr="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$ramo" \
            --title "Atualizar versão para v$VERSAO" \
            --body "Atualização automática de package.json e package-lock.json iniciada pelo workflow Preparar release.")"
          gh pr merge "$url_pr" --repo "$GITHUB_REPOSITORY" --merge
          if ! git push origin --delete "$ramo"; then
            echo "::warning::A branch temporária $ramo foi integrada, mas não pôde ser removida automaticamente."
          fi
          git fetch origin main
          commit="$(git rev-parse origin/main)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Definir commit imutável da release
        id: estado
        env:
          VERSAO: ${{ steps.planejamento.outputs.versao }}
          MODO: ${{ inputs.modo }}
          COMMIT_INTEGRADO: ${{ steps.integrar.outputs.commit }}
        run: |
          if [ "$MODO" = retomar ]; then
            commit="$(git rev-list -n 1 "v$VERSAO")"
          elif [ -n "$COMMIT_INTEGRADO" ]; then
            commit="$COMMIT_INTEGRADO"
          else
            commit="$GITHUB_SHA"
          fi
          git checkout --detach "$commit"
          VERSAO_ESPERADA="$VERSAO" node --input-type=module -e "import { lerVersaoProjeto } from './scripts/release/versao-projeto.mjs'; const atual = await lerVersaoProjeto(); if (atual !== process.env.VERSAO_ESPERADA) throw new Error(\`Versão do commit (\${atual}) difere da release (\${process.env.VERSAO_ESPERADA}).\`);"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Executar CI do commit imutável
        env:
          GH_TOKEN: ${{ github.token }}
          MODO: ${{ inputs.modo }}
          VERSAO: ${{ steps.planejamento.outputs.versao }}
        run: |
          referencia=main
          if [ "$MODO" = retomar ]; then referencia="v$VERSAO"; fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$referencia"

      - name: Aguardar CI do commit imutável
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.estado.outputs.commit }}
        run: |
          execucao_id=""
          for tentativa in {1..60}; do
            execucao_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --event workflow_dispatch \
              --commit "$COMMIT" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [ -n "$execucao_id" ]; then
              break
            fi
            echo "Aguardando a CI ser registrada para o commit $COMMIT (tentativa $tentativa/60)."
            sleep 10
          done

          if [ -z "$execucao_id" ]; then
            echo "::error::Nenhuma execução da CI foi encontrada para o commit $COMMIT."
            exit 1
          fi

          gh run watch "$execucao_id" \
            --repo "$GITHUB_REPOSITORY" \
            --compact \
            --exit-status \
            --interval 10

          gh run view "$execucao_id" \
            --repo "$GITHUB_REPOSITORY" \
            --json headSha,conclusion,url \
            --jq '"CI confirmada: \(.url) | commit=\(.headSha) | conclusão=\(.conclusion)"'

  build-windows:
    name: Build Windows x64
    needs: validar
    if: ${{ inputs.incluir_windows }}
    runs-on: windows-latest
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ needs.validar.outputs.commit }}

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar instalador
        run: npm run build; npx electron-builder --win --x64 --publish never

      - name: Confirmar versão do aplicativo empacotado
        shell: pwsh
        env:
          VERSAO: ${{ needs.validar.outputs.versao }}
        run: |
          $diretorioAplicativo = Get-ChildItem -LiteralPath dist -Directory |
            Where-Object { $_.Name -like 'win-unpacked*' } |
            Select-Object -First 1
          if ($null -eq $diretorioAplicativo) {
            throw 'Diretório win-unpacked não foi produzido pelo electron-builder.'
          }

          $arquivoAsar = Join-Path $diretorioAplicativo.FullName 'resources\app.asar'
          if (-not (Test-Path -LiteralPath $arquivoAsar -PathType Leaf)) {
            throw 'app.asar não foi produzido no aplicativo Windows empacotado.'
          }
          $versaoNoAsar = node --input-type=module -e "import { extractFile } from '@electron/asar'; const pacote = JSON.parse(extractFile(process.argv[1], 'package.json').toString('utf8')); process.stdout.write(pacote.version);" $arquivoAsar
          if ($versaoNoAsar.Trim() -ne $env:VERSAO) {
            throw "A versão do package.json empacotado ($versaoNoAsar) difere da versão solicitada ($env:VERSAO)."
          }

          $versaoSchemaFonte = node scripts/release/versao-schema.mjs
          $versaoSchemaNoAsar = node --input-type=module -e "import { extractFile } from '@electron/asar'; const fonte = extractFile(process.argv[1], 'out\\main\\database\\index.js').toString('utf8'); const resultado = fonte.match(/CURRENT_SCHEMA_VERSION = (\d+)/); if (!resultado) throw new Error('Versão do schema ausente no aplicativo empacotado.'); process.stdout.write(resultado[1]);" $arquivoAsar
          if ($versaoSchemaNoAsar.Trim() -ne $versaoSchemaFonte.Trim()) {
            throw "A versão do schema empacotada ($versaoSchemaNoAsar) difere da versão fonte ($versaoSchemaFonte)."
          }
          $fonteSchemaNoAsar = node --input-type=module -e "import { extractFile } from '@electron/asar'; process.stdout.write(extractFile(process.argv[1], 'out\\main\\database\\index.js').toString('utf8'));" $arquivoAsar
          if ($fonteSchemaNoAsar -notmatch 'fromVersion < 34') {
            throw 'A migration 34 não foi encontrada no aplicativo Windows empacotado.'
          }

          $executavel = Get-ChildItem -LiteralPath $diretorioAplicativo.FullName -Filter '*.exe' -File |
            Select-Object -First 1
          if ($null -eq $executavel) {
            throw 'Executável principal não foi produzido no aplicativo Windows empacotado.'
          }
          node scripts/release/executar-smoke-schema.mjs --executavel $executavel.FullName

          $versaoProduto = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($executavel.FullName).ProductVersion
          $padraoVersao = '^' + [regex]::Escape($env:VERSAO) + '(?:\.0)?$'
          if ($versaoProduto -notmatch $padraoVersao) {
            throw "A versão interna do executável ($versaoProduto) difere da versão solicitada ($env:VERSAO)."
          }

      - name: Enviar artefatos temporários
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.validar.outputs.versao }}-windows-x64
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    needs: validar
    if: ${{ inputs.incluir_linux }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ needs.validar.outputs.commit }}

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar pacotes
        shell: bash
        run: |
          npm run build
          for tentativa in 1 2 3; do
            if npx electron-builder --linux --x64 --publish never; then
              exit 0
            fi
            if [ "$tentativa" -eq 3 ]; then
              exit 1
            fi
            echo "::warning::Falha transitória ao reconstruir dependências nativas; nova tentativa em $((tentativa * 15)) segundos."
            rm -rf dist
            sleep $((tentativa * 15))
          done

      - name: Enviar artefatos temporários
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.validar.outputs.versao }}-linux-x64
          path: |
            dist/*.AppImage
            dist/*.AppImage.blockmap
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error

  build-macos-x64:
    name: Build macOS x64
    needs: validar
    if: ${{ inputs.incluir_macos }}
    runs-on: macos-latest
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ needs.validar.outputs.commit }}

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar pacotes
        run: npm run build && npx electron-builder --mac --x64 --publish never

      - name: Enviar artefatos temporários
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.validar.outputs.versao }}-macos-x64
          path: |
            dist/*.dmg
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS arm64
    needs: validar
    if: ${{ inputs.incluir_macos }}
    runs-on: macos-latest
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ needs.validar.outputs.commit }}

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar pacotes
        run: npm run build && npx electron-builder --mac --arm64 --publish never

      - name: Enviar artefatos temporários
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.validar.outputs.versao }}-macos-arm64
          path: |
            dist/*.dmg
          if-no-files-found: error

  agregar-release:
    name: Assinar e criar rascunho
    needs:
      - validar
      - build-windows
      - build-linux
      - build-macos-x64
      - build-macos-arm64
    if: ${{ always() && needs.validar.result == 'success' && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') && (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') && (needs.build-macos-x64.result == 'success' || needs.build-macos-x64.result == 'skipped') && (needs.build-macos-arm64.result == 'success' || needs.build-macos-arm64.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ needs.validar.outputs.commit }}

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Confirmar rascunho vazio para retomada
        if: ${{ inputs.modo == 'retomar' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ needs.validar.outputs.versao }}
        run: |
          test "$(gh release view "v$VERSAO" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "v$VERSAO" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" = 0

      - name: Baixar artefatos temporários
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-${{ needs.validar.outputs.versao }}-*
          path: artefatos

      - name: Normalizar nomes dos assets públicos
        run: |
          while IFS= read -r -d '' arquivo; do
            diretorio="$(dirname "$arquivo")"
            nome="$(basename "$arquivo")"
            normalizado="${nome// /.}"
            if [ "$nome" != "$normalizado" ]; then
              destino="$diretorio/$normalizado"
              test ! -e "$destino"
              mv "$arquivo" "$destino"
            fi
          done < <(find artefatos -type f -print0)

      - name: Criar ou confirmar tag imutável
        env:
          VERSAO: ${{ needs.validar.outputs.versao }}
          MODO: ${{ inputs.modo }}
        run: |
          if [ "$MODO" = criar ]; then
            git tag "v$VERSAO" "${{ needs.validar.outputs.commit }}"
            git push origin "v$VERSAO"
          else
            git fetch --tags --force origin "refs/tags/v$VERSAO:refs/tags/v$VERSAO"
            test "$(git rev-list -n 1 "v$VERSAO")" = "${{ needs.validar.outputs.commit }}"
          fi

      - name: Gerar manifesto assinado
        env:
          CHAVE_PRIVADA_ASSINATURA: ${{ secrets.CHAVE_PRIVADA_ASSINATURA }}
          VERSAO: ${{ needs.validar.outputs.versao }}
          NOTAS_ATUALIZACAO: ${{ inputs.notas_atualizacao }}
        run: |
          VERSAO_SCHEMA="$(node scripts/release/versao-schema.mjs)"
          node scripts/release/gerar-manifesto.mjs \
            --diretorio artefatos \
            --versao "$VERSAO" \
            --commit "${{ needs.validar.outputs.commit }}" \
            --versao-schema "$VERSAO_SCHEMA" \
            --url-release "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSAO" \
            --saida publicacao/manifesto.json \
            --assinatura publicacao/manifesto.json.sig

          node scripts/release/validar-schema-release.mjs --manifesto publicacao/manifesto.json

      - name: Gerar rascunho das notas da release
        env:
          CAMINHO_MANIFESTO: publicacao/manifesto.json
          CAMINHO_SAIDA: publicacao/notas-release.md
          NOTAS_ATUALIZACAO: ${{ inputs.notas_atualizacao }}
        run: node scripts/release/gerar-notas-release.mjs

      - name: Guardar manifesto assinado para promoção
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifesto-assinado-${{ needs.validar.outputs.versao }}
          path: |
            publicacao/manifesto.json
            publicacao/manifesto.json.sig
          retention-days: 90
          if-no-files-found: error

      - name: Criar release em rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ needs.validar.outputs.versao }}
          MODO: ${{ inputs.modo }}
        run: |
          mapfile -t assets < <(find artefatos -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \))
          if [ "$MODO" = criar ]; then
            gh release create "v$VERSAO" --repo "$GITHUB_REPOSITORY" --draft --title "laWdo v$VERSAO" --notes-file publicacao/notas-release.md "${assets[@]}"
          else
            gh release edit "v$VERSAO" --repo "$GITHUB_REPOSITORY" --title "laWdo v$VERSAO" --notes-file publicacao/notas-release.md
            gh release upload "v$VERSAO" --repo "$GITHUB_REPOSITORY" "${assets[@]}"
          fi
